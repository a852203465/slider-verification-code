spring:
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    servlet:
      content-type: text/html
    enabled: true
    encoding: UTF-8
    mode: HTML
    check-template-location: true

  # 静态文件请求匹配方式
  mvc:
    static-path-pattern: /**

# 权限
auth:
  # AES密码加密私钥(Base64加密)
  encryptAESKey: F4CL+Xa9KY7h0kJFrpQjeg==
  #JWT认证加密私钥(Base64加密)
  encryptJWTKey:  U0JBUElKV1RkV2FuZzkyNjQ1NA==